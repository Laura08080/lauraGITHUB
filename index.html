<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Laura - Atenea Makeup</title>
</head>
<body>
    <div style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin-top: 40px; background-color: #faf5f8; padding: 20px; border-radius: 12px;">
        
        <h1 style="color: #9b2c2c;"> Formulario de Laura </h1>
        <h2 style="color: #b7791f; font-weight: normal;">Opinión sobre Maquillaje Atenea </h2>
        <p style="color: #4a5568;">Queremos saber tu experiencia con nuestros productos favoritos</p>
        
        <form style="display: inline-block; text-align: left; background: #ffffff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px;">
            
            <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #2d3748;">Tu Nombre:</label>
            <input type="text" placeholder="Ej. Laura" style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #cbd5e0; border-radius: 5px; box-sizing: border-box;">
            
            <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #2d3748;">Producto favorito de Atenea:</label>
            <select style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #cbd5e0; border-radius: 5px; box-sizing: border-box;">
                <option>Paleta de Sombras </option>
                <option>Rubor en crema </option>
                <option>Tinta para labios </option>
                <option>Fijador de maquillaje </option>
                <option>Brochas </option>
            </select>
            
            <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #2d3748;">¿Qué calificación le das a su pigmentación?</label>
            <select style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #cbd5e0; border-radius: 5px; box-sizing: border-box;">
                <option>⭐⭐⭐⭐⭐ (10/10 Excelente)</option>
                <option>⭐⭐⭐⭐ (Muy buena)</option>
                <option>⭐⭐⭐ (Aceptable)</option>
            </select>

            <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #2d3748;">Tu opinión o reseña:</label>
            <textarea placeholder="Cuéntanos qué tal te pareció el maquillaje..." style="width: 100%; padding: 8px; margin-bottom: 20px; border: 1px solid #cbd5e0; border-radius: 5px; height: 80px; box-sizing: border-box;"></textarea>
            
            <button type="button" style="width: 100%; background-color: #9b2c2c; color: white; padding: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Enviar Opinión</button>
        </form>
    </div>
</body>
</html>
